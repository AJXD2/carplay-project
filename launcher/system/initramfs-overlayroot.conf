# Installed as /etc/initramfs-tools/conf.d/overlayroot by
# launcher/splash/install.sh. Initramfs builds on this Pi run inside
# overlayroot-chroot, where the defaults fail:
#   MODULES=dep can't work out the root device ("failed to determine device
#   for /"), so include most modules instead.
#   The fsck hook can't detect the root filesystem type and would leave fsck
#   out of the image, so name it.
MODULES=most
FSTYPE=ext4
