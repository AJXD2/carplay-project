# Installed as /etc/systemd/system/getty@tty1.service.d/noquery.conf by
# launcher/splash/install.sh.
#
# systemd 257 resets the terminal and asks it for its size with ANSI queries
# before it starts agetty, then waits for the answer. Plymouth holds tty1 in
# graphics mode until .bash_profile stops it, so nothing answers and the
# login (and with it X and the launcher) can hang on the splash for good.
# With a fixed size and no reset there is nothing to wait for. 100x30 is the
# 800x480 panel in the console's 8x16 font.
[Service]
TTYRows=30
TTYColumns=100
TTYReset=no
