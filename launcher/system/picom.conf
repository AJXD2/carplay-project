# picom (compositor) config for the carplay Pi. Deployed to
# ~/.config/picom/picom.conf by launcher/deploy.sh.
#
# App switching is an X unmap of one window and a map of the next (see
# wm_helper.hide_window/show_window), which picom sees as close/open, so
# these animations give every switch a short crossfade: the incoming app
# grows in from 96% as it fades up, the outgoing one fades out. If picom
# ever dies, X just draws the windows without effects, so a transition
# problem can never leave a blank screen.

backend = "xrender";
vsync = false;
shadow = false;
corner-radius = 0;

# replaced by the animations below
fading = false;

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.22;
    scale = 0.96;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.16;
    scale = 1.0;
  }
);

rules = (
  # notifications drop in from the top edge instead of popping
  {
    match = "class_g = 'Dunst'";
    animations = (
      {
        triggers = [ "open", "show" ];
        preset = "slide-in";
        direction = "down";
        duration = 0.24;
      },
      {
        triggers = [ "close", "hide" ];
        preset = "slide-out";
        direction = "up";
        duration = 0.18;
      }
    );
  }
);
