<!doctype html>
<!-- Wheel: the CarPlay tile's wheel icon draws itself in amber, the name
     wipes in beside it, and the tile's lamp becomes a progress runner. -->
<html lang="en" data-intro="2.2" data-loop="2.4">
<head>
<meta charset="utf-8">
<title>Splash: wheel</title>
<link rel="stylesheet" href="splash.css">
<style>
  .lockup {
    position: absolute;
    left: 50%; top: 196px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 26px;
  }

  /* Same 24px icon grid and 1.6 stroke as the launcher's i-carplay, scaled 4x. */
  .wheel { width: 96px; height: 96px; color: var(--amber); }
  .wheel * { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .rim {
    stroke-dasharray: 100 100;
    stroke-dashoffset: 100;
    transform: rotate(-90deg);
    transform-origin: 12px 12px;
    animation: draw 0.9s cubic-bezier(0.55, 0, 0.25, 1) both;
  }
  .hubring {
    transform-origin: 12px 12px;
    animation: pop 0.3s 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) both;
  }
  .spoke {
    stroke-dasharray: 100 100;
    stroke-dashoffset: 100;
    animation: draw 0.4s 0.9s cubic-bezier(0.3, 0.6, 0.3, 1) both;
  }
  .spoke:nth-of-type(2) { animation-delay: 0.97s; }
  .spoke:nth-of-type(3) { animation-delay: 1.04s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  .name {
    font-family: var(--num);
    font-weight: 600;
    font-size: 60px;
    line-height: 1;
    letter-spacing: 0.01em;
    padding-bottom: 4px;
    animation: wipe 0.6s 1.1s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes wipe {
    from { clip-path: inset(0 100% 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }

  /* The hero tile's lamp (64 x 3, rounded top) running along a dark rule. */
  .lamp-track {
    position: absolute;
    left: 50%; top: 330px;
    width: 256px; height: 3px;
    margin-left: -128px;
    background: var(--rule);
    border-radius: 3px;
    animation: fade 0.4s 1.6s both;
  }
  .lamp {
    position: absolute;
    left: 0; top: 0;
    width: 64px; height: 3px;
    border-radius: 3px 3px 0 0;
    background: var(--amber);
    box-shadow: 0 0 14px 2px var(--amber-glow);
    opacity: 0;
    animation: fade 0.4s 1.8s both, shuttle 2.4s 2.2s infinite;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shuttle {
    0% { transform: translateX(0); animation-timing-function: cubic-bezier(0.6, 0, 0.4, 1); }
    50% { transform: translateX(192px); animation-timing-function: cubic-bezier(0.6, 0, 0.4, 1); }
    100% { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="lockup">
    <svg class="wheel" viewBox="0 0 24 24">
      <circle class="rim" cx="12" cy="12" r="8.5" pathLength="100"/>
      <circle class="hubring" cx="12" cy="12" r="2.2"/>
      <path class="spoke" pathLength="100" d="M12 9.8V3.5"/>
      <path class="spoke" pathLength="100" d="M10.1 13.1 4.8 16.4"/>
      <path class="spoke" pathLength="100" d="M13.9 13.1l5.3 3.3"/>
    </svg>
    <div class="name">CarPlay</div>
  </div>
  <div class="lamp-track"><div class="lamp"></div></div>
</div>
</body>
</html>
