<!doctype html>
<!-- Bulb check: every app icon lights at once, the way a dash lights all
     its warning lamps when the key turns, then they go out from the edges
     in, leaving CarPlay lit. While the system comes up, lamps ripple
     outward from it. -->
<html lang="en" data-intro="2.0" data-loop="1.2">
<head>
<meta charset="utf-8">
<title>Splash: bulb check</title>
<link rel="stylesheet" href="splash.css">
<style>
  .bulbs {
    position: absolute;
    left: 0; right: 0; top: 194px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
  }
  .lamp-cell {
    position: relative;
    width: 52px; height: 92px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lamp-cell.center { width: 84px; }
  .lamp-cell svg { width: 48px; height: 48px; color: var(--steel-dim); }
  .lamp-cell.center svg { width: 76px; height: 76px; }

  /* Everything on at 0.35s, then off in pairs from the outside in. */
  .lamp-cell svg {
    animation: fade-up 0.25s both, bulb 1.6s 0.35s both;
  }
  .lamp-cell.d3 svg { animation-delay: 0s, 0.35s; animation-duration: 0.25s, 1.1s; }
  .lamp-cell.d2 svg { animation-delay: 0s, 0.35s; animation-duration: 0.25s, 1.22s; }
  .lamp-cell.d1 svg { animation-delay: 0s, 0.35s; animation-duration: 0.25s, 1.34s; }
  .lamp-cell.center svg { animation: fade-up 0.25s both, bulb-stay 0.2s 0.35s both; }
  @keyframes fade-up { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bulb {
    0% { color: var(--steel-dim); }
    2%, 90% { color: var(--amber); }
    100% { color: var(--steel-dim); }
  }
  @keyframes bulb-stay {
    0% { color: var(--steel-dim); }
    100% { color: var(--amber); }
  }

  /* Loop: a lamp under each icon, flashing outward from the centre. */
  .lamp-cell .lamp {
    position: absolute;
    left: 6px; right: 6px; bottom: 0;
    height: 3px;
    border-radius: 3px 3px 0 0;
    background: var(--amber);
    box-shadow: 0 0 14px 2px var(--amber-glow);
    opacity: 0;
    animation: ripple 1.2s 2.0s infinite;
  }
  .lamp-cell.center .lamp { left: 4px; right: 4px; }
  .lamp-cell.d1 .lamp { animation-delay: 2.3s; }
  .lamp-cell.d2 .lamp { animation-delay: 2.6s; }
  .lamp-cell.d3 .lamp { animation-delay: 2.9s; }
  @keyframes ripple {
    0% { opacity: 1; }
    40%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-carplay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/>
      <path d="M12 9.8V3.5M10.1 13.1 4.8 16.4M13.9 13.1l5.3 3.3"/>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/>
      <path d="M4.5 13.5h1.3M18.2 13.5h1.3M7 8.5l.9.9M16.1 9.4l.9-.9M12 6v1.3"/>
    </symbol>
    <symbol id="i-trip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 20V6a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v14M4 20h11M5 11h9"/>
      <path d="M14 8h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V9l-2.5-2.5"/>
    </symbol>
    <symbol id="i-logs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M7 9l2.5 2.5L7 14M12 14h5"/>
    </symbol>
    <symbol id="i-devices" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>
    </symbol>
    <symbol id="i-flappy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 13.5c0-4 3.2-6.5 7-6.5 3.5 0 6 2 6.8 4.5L21 10l-2.6 3.4c-.6 3-3.5 4.6-7.4 4.6-4 0-7-1.7-7-4.5Z"/>
      <path d="M5.5 13.5c1.5-1.8 4-2 5.5-.5"/><circle cx="14.5" cy="10.5" r=".9" fill="currentColor"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
    </symbol>
  </defs>
</svg>

<div class="stage">
  <!-- d1..d3: distance from CarPlay, which sets when each goes out and ripples -->
  <div class="bulbs">
    <div class="lamp-cell d3"><svg><use href="#i-info"/></svg><span class="lamp"></span></div>
    <div class="lamp-cell d2"><svg><use href="#i-trip"/></svg><span class="lamp"></span></div>
    <div class="lamp-cell d1"><svg><use href="#i-logs"/></svg><span class="lamp"></span></div>
    <div class="lamp-cell center"><svg><use href="#i-carplay"/></svg><span class="lamp"></span></div>
    <div class="lamp-cell d1"><svg><use href="#i-devices"/></svg><span class="lamp"></span></div>
    <div class="lamp-cell d2"><svg><use href="#i-flappy"/></svg><span class="lamp"></span></div>
    <div class="lamp-cell d3"><svg><use href="#i-settings"/></svg><span class="lamp"></span></div>
  </div>
</div>
</body>
</html>
